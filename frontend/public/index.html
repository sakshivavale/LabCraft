<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Viewport meta tag ensures proper rendering on mobile devices -->
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Theme color for browser chrome on mobile (matches our dark navy background) -->
    <meta name="theme-color" content="#0f172a" />
    <!-- App description for SEO and accessibility -->
    <meta name="description" content="LabCraft — the coding lab platform for students and teachers" />
    <!-- Page title shown in browser tab -->
    <title>LabCraft</title>
  </head>
  <body>
    <!-- noscript fallback: shown if JavaScript is disabled in the browser -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <!-- React mounts the entire app into this div; "root" matches ReactDOM.createRoot('#root') -->
    <div id="root"></div>
  </body>
</html>
